name: CD - Production (Backend)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing image tag (commit SHA) to redeploy; leave empty to build the selected ref"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/naferj/luisardito-shop-backend

jobs:
  build:
    if: inputs.image_tag == ''
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            platform_pair: linux-amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            platform_pair: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform_pair }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform_pair }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-${{ matrix.platform_pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker buildx imagetools create \
              -t "${{ env.IMAGE }}:${{ github.sha }}" \
              -t "${{ env.IMAGE }}:main" \
              $(printf '${{ env.IMAGE }}@sha256:%s ' *)
          else
            docker buildx imagetools create \
              -t "${{ env.IMAGE }}:${{ github.sha }}" \
              $(printf '${{ env.IMAGE }}@sha256:%s ' *)
          fi
          docker buildx imagetools inspect "${{ env.IMAGE }}:${{ github.sha }}"

  deploy:
    needs: [merge]
    if: always() && (needs.merge.result == 'success' || (needs.merge.result == 'skipped' && inputs.image_tag != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
    steps:
      - name: Check PROD secrets presence
        run: |
          echo "HAS_HOST=$HAS_HOST"
          echo "HAS_USER=$HAS_USER"
          echo "HAS_PORT=$HAS_PORT"
          echo "HAS_KEY=$HAS_KEY"
        env:
          HAS_HOST: ${{ secrets.PROD_SSH_HOST != '' }}
          HAS_USER: ${{ secrets.PROD_SSH_USER != '' }}
          HAS_PORT: ${{ secrets.PROD_SSH_PORT != '' }}
          HAS_KEY: ${{ secrets.PROD_SSH_KEY != '' }}

      - name: Validate PROD SSH inputs
        shell: bash
        run: |
          [ "$PROD_SSH_HOST" != "" ] || { echo "PROD_SSH_HOST missing"; exit 1; }
          [ "$PROD_SSH_USER" != "" ] || { echo "PROD_SSH_USER missing"; exit 1; }
          [ "$PROD_SSH_PORT" != "" ] || { echo "PROD_SSH_PORT missing"; exit 1; }
          [ "$PROD_SSH_KEY" != "" ] || { echo "PROD_SSH_KEY missing"; exit 1; }
          echo "All required PROD SSH secrets are present."
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}

      - name: Test PROD SSH connection
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          passphrase: ${{ secrets.PROD_SSH_PASSPHRASE }}
          port: ${{ secrets.PROD_SSH_PORT }}
          script: |
            whoami
            pwd
            echo "SSH OK"

      - name: Validate R2 secrets
        shell: bash
        run: |
          [ "$R2_ENDPOINT" != "" ] || { echo "R2_ENDPOINT missing"; exit 1; }
          [ "$R2_ACCESS_KEY_ID" != "" ] || { echo "R2_ACCESS_KEY_ID missing"; exit 1; }
          [ "$R2_SECRET_ACCESS_KEY" != "" ] || { echo "R2_SECRET_ACCESS_KEY missing"; exit 1; }
          [ "$R2_BUCKET_NAME" != "" ] || { echo "R2_BUCKET_NAME missing"; exit 1; }
          echo "All required R2 secrets are present."
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

      - name: Ensure production .env file exists
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          passphrase: ${{ secrets.PROD_SSH_PASSPHRASE }}
          port: ${{ secrets.PROD_SSH_PORT }}
          script: |
            set -e
            ENV_PATH="$HOME/.env.backend.production"
            # Create or overwrite .env with production secrets (safe line-by-line to avoid indentation issues)
            rm -f "$ENV_PATH"
            echo "NODE_ENV=production" >> "$ENV_PATH"
            echo "PORT=${{ secrets.PROD_APP_PORT }}" >> "$ENV_PATH"
            echo "DB_HOST=${{ secrets.PROD_DB_HOST }}" >> "$ENV_PATH"
            echo "DB_PORT=${{ secrets.PROD_DB_PORT }}" >> "$ENV_PATH"
            echo "DB_USER=${{ secrets.PROD_DB_USER }}" >> "$ENV_PATH"
            echo "DB_PASSWORD=${{ secrets.PROD_DB_PASS }}" >> "$ENV_PATH"
            echo "DB_NAME=${{ secrets.PROD_DB_NAME }}" >> "$ENV_PATH"
            echo "DB_SSL=${{ secrets.PROD_DB_SSL }}" >> "$ENV_PATH"
            echo "DB_SSL_REJECT_UNAUTHORIZED=${{ secrets.PROD_DB_SSL_REJECT_UNAUTHORIZED }}" >> "$ENV_PATH"

            # Docker Database & Cache credentials
            echo "MYSQL_ROOT_PASSWORD=${{ secrets.PROD_MYSQL_ROOT_PASSWORD }}" >> "$ENV_PATH"
            echo "MYSQL_PASSWORD=${{ secrets.PROD_DB_PASS }}" >> "$ENV_PATH"

            echo "JWT_SECRET=${{ secrets.PROD_JWT_SECRET }}" >> "$ENV_PATH"
            echo "KICK_CLIENT_ID=${{ secrets.PROD_KICK_CLIENT_ID }}" >> "$ENV_PATH"
            echo "KICK_CLIENT_SECRET=${{ secrets.PROD_KICK_CLIENT_SECRET }}" >> "$ENV_PATH"
            echo "KICK_REDIRECT_URI=${{ secrets.PROD_KICK_REDIRECT_URI }}" >> "$ENV_PATH"
            # Kick API/OAuth hosts (non-PROD-prefixed repo secrets as requested)
            echo "KICK_API_BASE_URL=${{ secrets.KICK_API_BASE_URL }}" >> "$ENV_PATH"
            echo "KICK_OAUTH_AUTHORIZE_URL=${{ secrets.KICK_OAUTH_AUTHORIZE_URL }}" >> "$ENV_PATH"
            echo "KICK_OAUTH_TOKEN_URL=${{ secrets.KICK_OAUTH_TOKEN_URL }}" >> "$ENV_PATH"
            echo "KICK_OAUTH_REVOKE_URL=${{ secrets.KICK_OAUTH_REVOKE_URL }}" >> "$ENV_PATH"
            echo "KICK_BROADCASTER_ID=${{ secrets.KICK_BROADCASTER_ID }}" >> "$ENV_PATH"

            # Logging settings (false = logs apagados para máximo rendimiento)
            echo "DEBUG_LOGS=true" >> "$ENV_PATH"

            # Kick BOT application
            echo "KICK_BOT_CLIENT_SECRET=${{ secrets.KICK_BOT_CLIENT_SECRET }}" >> "$ENV_PATH"
            echo "KICK_BOT_CLIENT_ID=${{ secrets.KICK_BOT_CLIENT_ID }}" >> "$ENV_PATH"
            echo "KICK_BOT_REDIRECT_URI=${{ secrets.KICK_BOT_REDIRECT_URI }}" >> "$ENV_PATH"
            echo "KICK_BOT_USERNAME=${{ secrets.KICK_BOT_USERNAME }}" >> "$ENV_PATH"

            # Bot maintenance settings
            echo "BOT_MAINTENANCE_SIMULATE_ACTIVITY=true" >> "$ENV_PATH"
            echo "BOT_MAINTENANCE_INTERVAL_MINUTES=15" >> "$ENV_PATH"

            # Redis configuration
            echo "REDIS_HOST=redis" >> "$ENV_PATH"
            echo "REDIS_PORT=6379" >> "$ENV_PATH"
            echo "REDIS_PASSWORD=${{ secrets.PROD_REDIS_PASSWORD }}" >> "$ENV_PATH"
            echo "REDIS_DB=0" >> "$ENV_PATH"

            # Stream monitor configuration
            echo "STREAM_MONITOR_ENABLED=false" >> "$ENV_PATH"

            # Cookie configuration for cross-domain
            echo "COOKIE_DOMAIN=.luisardito.com" >> "$ENV_PATH"
            # Cloudinary configuration (optional - uncomment when ready to use)
            # echo "CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}" >> "$ENV_PATH"
            # echo "CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}" >> "$ENV_PATH"
            # echo "CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}" >> "$ENV_PATH"
            echo "FRONTEND_URL=https://luisardito.com" >> "$ENV_PATH"

            # Leaderboard configuration
            echo "LEADERBOARD_SNAPSHOT_INTERVAL_HOURS=336" >> "$ENV_PATH"
            echo "LEADERBOARD_CLEANUP_DAYS=30" >> "$ENV_PATH"

            # Backup configuration (local tier + Cloudflare R2 remote tier)
            echo "BACKUP_ENABLED=true" >> "$ENV_PATH"
            echo "BACKUP_TIME=03:00" >> "$ENV_PATH"
            echo "BACKUP_RETENTION_DAYS=3" >> "$ENV_PATH"
            echo "BACKUP_REMOTE_RETENTION_DAYS=30" >> "$ENV_PATH"
            echo "R2_ENDPOINT=${{ secrets.R2_ENDPOINT }}" >> "$ENV_PATH"
            echo "R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}" >> "$ENV_PATH"
            echo "R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}" >> "$ENV_PATH"
            echo "R2_BUCKET_NAME=${{ secrets.R2_BUCKET_NAME }}" >> "$ENV_PATH"

            # Discord Bot Configuration
            echo "DISCORD_BOT_TOKEN=${{ secrets.DISCORD_BOT_TOKEN }}" >> "$ENV_PATH"
            echo "DISCORD_CLIENT_ID=${{ secrets.DISCORD_CLIENT_ID }}" >> "$ENV_PATH"
            echo "DISCORD_CLIENT_SECRET=${{ secrets.DISCORD_CLIENT_SECRET }}" >> "$ENV_PATH"
            echo "DISCORD_GUILD_ID=${{ secrets.DISCORD_GUILD_ID }}" >> "$ENV_PATH"
            echo "DISCORD_REDIRECT_URI=https://api.luisardito.com/api/auth/discord/callback" >> "$ENV_PATH"

            echo "SEED_DEFAULT_PASSWORD=${{ secrets.SEED_DEFAULT_PASSWORD }}" >> "$ENV_PATH"

            # Kick Webhook signature verification
            echo "KICK_WEBHOOK_PUBLIC_KEY=${{ secrets.KICK_WEBHOOK_PUBLIC_KEY }}" >> "$ENV_PATH"

            echo "IMAGE_TAG=${{ env.IMAGE_TAG }}" >> "$ENV_PATH"

            chmod 600 "$ENV_PATH"
            echo "Wrote $ENV_PATH"
            sed -e 's/=.*/=***/' "$ENV_PATH"
            ls -l "$ENV_PATH"

      - name: Deploy with Docker Compose (production)
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          passphrase: ${{ secrets.PROD_SSH_PASSPHRASE }}
          port: ${{ secrets.PROD_SSH_PORT }}
          script: |
            set -e
            APP_DIR="$HOME/apps/luisardito-shop-backend"
            REPO_URL="https://github.com/NaferJ/luisardito-shop-backend.git"
            if [ -d "$APP_DIR/.git" ]; then
              cd "$APP_DIR"
              git remote set-url origin "$REPO_URL"
            else
              mkdir -p "$HOME/apps"
              cd "$HOME/apps"
              git clone "$REPO_URL" luisardito-shop-backend
              cd luisardito-shop-backend
            fi
            git fetch --depth 1 origin "${{ env.IMAGE_TAG }}"
            git reset --hard FETCH_HEAD

            # Copy .env to project directory for docker-compose to resolve it
            cp $HOME/.env.backend.production .env

            # Remove possible conflicting containers by name to avoid name conflicts
            for c in luisardito-mysql luisardito-backend; do
              if docker ps -a --format '{{.Names}}' | grep -q "^${c}$"; then
                docker rm -f "$c"
              fi
            done

            # Pull the prebuilt multi-arch image and bring the stack up without building
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull api
            docker compose -f docker-compose.yml -f docker-compose.prod.yml down
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-build --wait --wait-timeout 180

            # Show status
            docker compose -f docker-compose.yml -f docker-compose.prod.yml ps

            # Prune dangling images left by previous deploys
            docker image prune -f

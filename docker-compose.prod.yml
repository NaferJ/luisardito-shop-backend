services:
  db:
    env_file:
      - .env
    # Publish MySQL only on loopback for SSH tunneling from DataGrip
    ports:
      - "127.0.0.1:3307:3306"
    restart: unless-stopped

  redis:
    env_file:
      - .env

  api:
    image: ghcr.io/naferj/luisardito-shop-backend:${IMAGE_TAG:-main}
    env_file:
      - .env
    command: >
      sh -c "npx sequelize db:migrate --debug && npm run start:prod"
    ports:
      - "127.0.0.1:3001:3000"
    restart: unless-stopped
    volumes:
      - ./tokens:/app/tokens
      - ./backups:/app/backups

volumes:
  db_data:
    name: luisardito-shop-backend_db_data
  redis_data:
    name: luisardito-shop-backend_redis_data
